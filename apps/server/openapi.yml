openapi: 3.1.0
info:
  title: Hono Mono Starter API
  version: 1.0.0
components:
  schemas:
    Note:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - body
        - createdAt
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Error message
          examples:
            - Not found
      required:
        - error
    CreateNoteInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
      required:
        - title
        - body
    TickEvent:
      oneOf:
        - $ref: "#/components/schemas/Tick"
        - $ref: "#/components/schemas/TickDone"
      discriminator:
        propertyName: type
        mapping:
          tick: "#/components/schemas/Tick"
          done: "#/components/schemas/TickDone"
    Tick:
      type: object
      properties:
        type:
          type: string
          enum:
            - tick
        n:
          type: integer
        total:
          type: integer
        at:
          type: string
      required:
        - type
        - n
        - total
        - at
    TickDone:
      type: object
      properties:
        type:
          type: string
          enum:
            - done
        total:
          type: integer
      required:
        - type
        - total
  parameters: {}
paths:
  /api/notes:
    get:
      tags:
        - Notes
      summary: List the current user’s notes
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - Notes
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/ticks:
    get:
      tags:
        - Ticks
      summary: Stream ticks as server-sent events
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          required: false
          name: count
          in: query
        - schema:
            type: integer
            minimum: 1
          required: false
          name: after
          in: query
      responses:
        "200":
          description: One event per tick, then a done event
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/TickEvent"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
webhooks: {}
